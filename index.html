<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Star Remodeling By Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">
  <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center">
    
    <!-- Profile Logo: Round & Focused on Central Badge -->
    <div class="w-36 h-36 rounded-full overflow-hidden border-2 border-amber-500 shadow-xl shadow-amber-500/10 mb-5 bg-slate-950 flex items-center justify-center">
      <img src="./New%20Facebook%20Logo.png" alt="Five Star Remodeling By Design Logo" class="w-full h-full object-cover object-center scale-150">
    </div>
    
    <!-- Stacked Title -->
    <h1 class="text-2xl font-bold tracking-tight text-white text-center leading-snug">
      Five Star Remodeling<br>By Design
    </h1>
    <p class="text-xs uppercase tracking-widest text-amber-400 font-semibold mt-1.5 text-center">Custom Home & Remodeling</p>
    <p class="text-xs text-slate-400 mt-1 mb-5 flex items-center justify-center gap-1.5 text-center">
      <i class="fa-solid fa-location-dot text-amber-500"></i> Nassau & Suffolk County, NY
    </p>

    <!-- Review Section: Framed Box with Blue Outline -->
    <div class="w-full bg-slate-950/70 border-2 border-blue-500/80 rounded-2xl p-4 shadow-lg shadow-blue-500/10 mb-5">
      <div class="flex items-center justify-center gap-1.5 text-amber-400 text-xs mb-1">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>
      <p class="text-xs font-semibold text-center text-blue-200 tracking-wide uppercase mb-3.5">
        Leave a Verified Review
      </p>

      <div class="space-y-2.5">
        <a href="https://www.google.com/search?q=Five+Star+Remodeling+By+Design+NY" target="_blank" rel="noopener noreferrer" 
           class="flex items-center justify-center gap-3 w-full p-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-md transition-transform active:scale-95 text-center">
          <i class="fa-brands fa-google text-lg"></i>
          <span>Review on Google</span>
        </a>

        <a href="https://www.yelp.com/writeareview/biz/Q2czfCE0vLp8ttydJRGQ5A?return_url=%2Fbiz%2FQ2czfCE0vLp8ttydJRGQ5A&review_origin=biz-details-war-button" target="_blank" rel="noopener noreferrer" 
           class="flex items-center justify-center gap-3 w-full p-3 bg-red-600/15 border border-red-500/30 hover:bg-red-600/25 text-red-300 font-semibold rounded-xl transition-transform active:scale-95 text-center">
          <i class="fa-brands fa-yelp text-lg text-red-500"></i>
          <span>Review on Yelp</span>
        </a>
      </div>
    </div>

    <!-- Contact & Action Buttons (Centered) -->
    <div class="w-full space-y-2.5 mb-5">
      <a href="tel:+15169884416" 
         class="flex items-center justify-center gap-3 w-full p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-700/80 rounded-2xl text-slate-200 transition text-center">
        <i class="fa-solid fa-phone text-amber-400"></i>
        <span>Call (516) 988-4416 for an Estimate</span>
      </a>

      <a href="https://www.instagram.com/fivestarremodelingbydesigns/" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-center gap-3 w-full p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-700/80 rounded-2xl text-slate-200 transition text-center">
        <i class="fa-brands fa-instagram text-pink-400"></i>
        <span>Recent Work Portfolio</span>
      </a>

      <a href="https://www.facebook.com/people/Five-Star-Remodeling-By-Design/61595597354978/" target="_blank" rel="noopener noreferrer" 
         class="flex items-center justify-center gap-3 w-full p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-700/80 rounded-2xl text-slate-200 transition text-center">
        <i class="fa-brands fa-facebook text-blue-400"></i>
        <span>Facebook Page</span>
      </a>
    </div>

    <!-- Footer -->
    <p class="text-[11px] text-slate-500 mt-2 text-center">Licensed & Insured Residential Contractor</p>
  </main>
</body>
</html>
